<!doctype html>
<html lang="en" data-i18n-title="extensionName">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bilibili Archive Helper</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <div class="mark">BA</div>
        <div>
          <h1>Bilibili Archive Helper</h1>
          <p data-i18n="tagline">Current page · Signed-in session · Serial save</p>
        </div>
      </header>

      <section class="card summary" aria-live="polite">
        <div class="eyebrow" data-i18n="currentVideo">Current video</div>
        <div id="page-title" class="title" data-i18n="waitingRecognition">Waiting for recognition</div>
        <div id="page-meta" class="meta" data-i18n="openPagePrompt">Open a Bilibili video or bangumi page first.</div>
      </section>

      <section class="card controls">
        <label>
          <span data-i18n="quality">Quality</span>
          <select id="quality">
            <option value="127" data-i18n="highestAvailable">Highest available</option>
            <option value="80">1080P</option>
            <option value="64">720P</option>
            <option value="32">480P</option>
          </select>
        </label>

        <label>
          <span data-i18n="danmakuHistory">Danmaku history</span>
          <select id="history-mode">
            <option value="enhanced" data-i18n="enhancedRecommended">Enhanced history (recommended)</option>
            <option value="current" data-i18n="currentEndpoints">Current endpoints</option>
            <option value="monthly" data-i18n="monthlySlow">Monthly snapshots (very slow)</option>
          </select>
        </label>

        <div class="checks">
          <label><input id="include-video" type="checkbox" checked> <span data-i18n="video">Video</span></label>
          <label><input id="include-danmaku" type="checkbox" checked> <span data-i18n="assSubtitles">ASS subtitles</span></label>
          <label><input id="include-metadata" type="checkbox" checked> NFO</label>
        </div>
        <label class="merge-check"><input id="auto-merge" type="checkbox" checked> <span data-i18n="autoMerge">Losslessly merge DASH streams into MP4</span></label>

        <button id="analyze" class="secondary" type="button" data-i18n="reanalyze">Analyze again</button>
        <button id="download" class="primary" type="button" disabled data-i18n="prepareSave">Prepare files and choose a folder</button>
      </section>

      <section class="card progress-card">
        <div class="progress-head">
          <span data-i18n="progress">Progress</span>
          <span id="progress-label" data-i18n="idle">Idle</span>
        </div>
        <div class="progress"><div id="progress-bar"></div></div>
        <pre id="log" data-i18n="notStarted">Not started.</pre>
      </section>

      <footer data-i18n="privacyFooter">Choose a folder once; no paywall or DRM bypass; no cookie export; no proxy changes.</footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
